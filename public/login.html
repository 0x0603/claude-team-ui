<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Sign in · Claude Team</title>
<script>try{var t=localStorage.getItem('ctu-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <form class="login-card glass" method="post" action="/login">
    <h1>Claude Team</h1>
    <p>Paste the token the server printed when it started. It is also in ~/.config/claude-team-ui/token.</p>
    <input name="token" type="password" autocomplete="current-password" placeholder="Token" aria-label="Token" required autofocus>
    <p id="err" class="err" hidden>Wrong token. Try again.</p>
    <button class="btn primary wide" type="submit">Sign in</button>
  </form>
  <script>if (location.search.includes('err=1')) document.getElementById('err').hidden = false;</script>
</body>
</html>
